<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="page-inner">
      <div class="header">
        <h1 class="heading-font title">Nutrition Calendar</h1>
        <p class="subtitle">A read-only look back at what was logged, day by day.</p>
      </div>
      <div class="layout">
        <div id="calendar-slot" class="calendar-card"></div>
        <div id="detail-slot" class="detail-card"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
